name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The Docker build skips the type check (SKIP_BUILD_TYPECHECK), so this is where it runs.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
